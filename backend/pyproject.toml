[project]
name = "driving-exam-assistant"
version = "1.0.0"
description = "驾考宝典智能查询助手后端：试卷生成与 MD 下载、驾考知识问答、自定义题库自动阅卷"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "filetype>=1.2.0",
    # python-markdown（PyPI 官方发行名 Markdown，import markdown）
    "markdown>=3.11.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
serve = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
]
